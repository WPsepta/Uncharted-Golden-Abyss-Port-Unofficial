<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .header { text-align: center; color: #f5c542; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .tabs { display: flex; gap: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 15px; overflow-x: auto; }
        .tab { color: #888; font-size: 14px; cursor: pointer; }
        .tab.active { color: #f5c542; font-weight: bold; border-bottom: 2px solid #f5c542; }
        .content { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .btn { background-color: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; text-align: center; border-radius: 5px; font-size: 14px; cursor: pointer; }
        .btn:active { background-color: #444; }
        .btn-primary { background-color: #f5c542; color: black; font-weight: bold; border: none; }
        .btn-primary:active { background-color: #d4a832; }
        .folder-path { font-size: 11px; color: #aaa; text-align: center; word-break: break-all; }
        .fps-list label { display: block; margin: 5px 0; font-size: 14px; }
        .footer { text-align: right; color: #666; font-size: 12px; margin-top: auto; padding-top: 10px; }
        .hide { display: none; }
    </style>
</head>
<body>
    <div class="header">Uncharted: Golden Abyss</div>
    
    <div class="tabs">
        <div class="tab active" onclick="showTab('launcher')">Launcher</div>
        <div class="tab" onclick="showTab('perf')">Performance</div>
        <div class="tab" onclick="showTab('ctrl')">Controls</div>
        <div class="tab" onclick="showTab('sys')">System</div>
        <div class="tab" onclick="showTab('info')">Info</div>
        <div class="tab" onclick="showTab('log')">Log</div>
    </div>

    <div id="tab-launcher" class="content">
        <div class="btn" onclick="pickFolder()">PILIH FOLDER ASET GAME</div>
        <div id="path-text" class="folder-path">Folder aset belum dipilih</div>
        <div class="btn btn-primary" onclick="startGame()">MULAI GAME</div>
    </div>

    <div id="tab-perf" class="content hide">
        <div>Batas Frame Rate (FPS):</div>
        <div class="fps-list">
            <label><input type="radio" name="fps" value="30"> 30 FPS</label>
            <label><input type="radio" name="fps" value="60" checked> 60 FPS (Recommended)</label>
            <label><input type="radio" name="fps" value="90"> 90 FPS</label>
            <label><input type="radio" name="fps" value="120"> 120 FPS ⚠️ Experimental</label>
            <label><input type="radio" name="fps" value="0"> Unlimited ⚠️ Experimental</label>
        </div>
        <div style="margin-top: 10px;">Skala Resolusi:</div>
        <input type="range" min="50" max="100" value="75" style="width: 100%;">
    </div>

    <div class="footer">🐙 WPsepta</div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.add('hide'));
            document.querySelector(`[onclick="showTab('${id}')"]`).classList.add('active');
            document.getElementById('tab-' + id).classList.remove('hide');
        }
        function pickFolder() {
            if (window.Android) window.Android.pickFolder();
        }
        function startGame() {
            if (window.Android) window.Android.startGame();
        }
        function updatePath(path) {
            document.getElementById('path-text').innerText = path;
        }
    </script>
</body>
</html>
