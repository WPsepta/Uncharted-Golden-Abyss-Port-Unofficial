name: Build Uncharted_Port APK (launcher + kode game dari source_code.zip)

# PENTING — arsitektur "clean room":
#   - Repo ini TIDAK pernah berisi kode game hasil rekompilasi (gen/, recomp.cpp/h)
#     maupun aset game. Job "forbidden-files" menolak push semacam itu.
#   - Kode game diambil dari source_code.zip yang diunggah MANUAL (GitHub web /
#     release asset) — tidak ikut git. CI mencari file itu di checkout, atau
#     mengunduhnya dari SOURCE_ZIP_URL, mengekstraknya ke app/src/main/cpp/,
#     lalu membangun APK lewat CMake.
#   - Jika source_code.zip tidak ditemukan, build gagal dengan pesan yang jelas.
#
# Hasil CI: APK berisi launcher + overlay + kode game (bila source_code.zip ada).
# Aset game TIDAK pernah dibundle: user memilih folder aset di launcher (SAF).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      source_url:
        description: 'URL source_code.zip (GitHub release asset).'
        required: false
        default: 'https://github.com/WPsepta/Uncharted-Golden-Abyss-Port-Unofficial/releases/download/V1/source_code.zip'

permissions:
  contents: read

jobs:
  forbidden-files:
    name: "Guard: tidak ada konten game ter-commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject recompiled / decrypted game files in repo
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(gen/|extracted/|assets/|PCSA00029/|recomp(\.cpp|\.h)$|uncharted_decrypted|source_code\.zip$|\.self$|\.elf$|eboot\.bin$)' | grep -v '^app/src/main/assets/' || true)
          if [ -n "$bad" ]; then
            echo "::error::File game tidak boleh masuk repo:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK: tidak ada konten game di repositori."

  build-apk:
    name: "Assemble debug APK (JDK 17 + NDK)"
    runs-on: ubuntu-latest
    needs: forbidden-files
    steps:
      - uses: actions/checkout@v4

      - name: Ambil source_code.zip (kode game — diunggah manual, bukan dari git)
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url || vars.SOURCE_ZIP_URL }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          url="$SOURCE_URL"
          if [ ! -f source_code.zip ] && [ -n "$url" ]; then
            echo "source_code.zip tidak ada di checkout; mengunduh dari: $url"
            curl -fSL --retry 3 --connect-timeout 20 -o source_code.zip "$url"
          fi
          if [ ! -f source_code.zip ]; then
            echo "::error::source_code.zip tidak ditemukan."
            echo "::error::Unggah source_code.zip (berisi recomp.cpp, recomp.h, gen/recompiled_part*.cpp) ke repo ini, ATAU atur variable SOURCE_ZIP_URL / input source_url ke URL release asset, lalu jalankan ulang workflow."
            exit 1
          fi
          echo "Ukuran source_code.zip: $(du -h source_code.zip | cut -f1)"
          unzip -q -o source_code.zip -d app/src/main/cpp/
          test -f app/src/main/cpp/recomp.cpp
          test -f app/src/main/cpp/recomp.h
          test -d app/src/main/cpp/gen
          echo "OK: kode sumber game terekstrak ke app/src/main/cpp/"

      - name: Patch HLE dispatch + telemetri fault (HLE_MISSING / GUEST_FAULT)
        run: |
          set -euo pipefail
          python3 tools/patch_hle_fallback.py app/src/main/cpp/recomp.cpp
          grep -q 'HLE_MISSING' app/src/main/cpp/recomp.cpp
          grep -q '\[FAULT_DBG_UNIMPL\]' app/src/main/cpp/recomp.cpp
          grep -q '\[BLOCK_MISS\]' app/src/main/cpp/recomp.cpp
          grep -q '\[ENTRY_PROBE\]' app/src/main/cpp/recomp.cpp
          grep -q '\[LOADER_PHDR_FIX\]' app/src/main/cpp/recomp.cpp
          grep -q 'rc_dbg_clear' app/src/main/cpp/recomp.cpp
          grep -q 'return 0;' app/src/main/cpp/recomp.cpp
          grep -q '\[NULL_INDIRECT\]' app/src/main/cpp/recomp.cpp
          grep -q '\[SPIN_DETECT\]' app/src/main/cpp/recomp.cpp
          grep -q '\[MEM_TOLERATE\]' app/src/main/cpp/recomp.cpp
          echo "OK: rc_hle_dispatch + telemetri fault (fault/unimpl/block-miss/HLE/null-indirect/spin/mem-tolerate) + fix loader dipatch."

      - name: Patch blok rekompilasi yang bolong (GEN_FIX)
        run: |
          set -euo pipefail
          python3 tools/patch_gen_blocks.py app/src/main/cpp
          grep -q '\[GEN_FIX\]' app/src/main/cpp/gen/recompiled_part999.cpp
          grep -q '\[GEN_FIX_REGISTRY\]' app/src/main/cpp/gen/recompiled_parts.cpp
          grep -q '\[GEN_FIX_LOOKUP\]' app/src/main/cpp/recomp.cpp
          echo "OK: blok perbaikan (part999 + registry + lookup) diterapkan."

      - name: Regenerate blok Thumb-2 yang invalid (REGEN_INVALID)
        run: |
          set -euo pipefail
          python3 tools/regen_invalid_region.py app/src/main/cpp
          grep -q '\[REGEN_INVALID\]' app/src/main/cpp/gen/recompiled_part998.cpp
          grep -q 'rc_blocks_part998' app/src/main/cpp/gen/recompiled_parts.cpp
          grep -q 'rc_blocks_part998' app/src/main/cpp/gen/recompiled_part999.cpp
          echo "OK: 81 blok Thumb-2 region 0x81386d9a..0x81387592 diregenerate."

      - name: Rewrite mrc c13 TLS-get (MRC_C13_TLS)
        run: |
          set -euo pipefail
          python3 tools/patch_mrc_c13.py app/src/main/cpp
          if grep -rqE 'RC_UNIMPL\(0x[0-9a-f]+u, "mrc p15, 0, r[0-9]+, c13, c0, 3"\)' app/src/main/cpp/gen/; then
            echo "::error::masih ada RC_UNIMPL mrc c13 setelah rewrite."
            exit 1
          fi
          echo "OK: semua mrc p15 c13 TLS-get jadi c.r[X] = 0x81970000u."

      - name: Rewrite ldrd/strd register-pair (LDRD_STRD)
        run: |
          set -euo pipefail
          python3 tools/patch_ldrd_strd.py app/src/main/cpp
          if grep -rqE 'RC_UNIMPL\(0x[0-9a-f]+u, "(ldrd|strd)' app/src/main/cpp/gen/; then
            echo "::error::masih ada RC_UNIMPL ldrd/strd setelah rewrite."
            exit 1
          fi
          echo "OK: semua ldrd/strd jadi pasangan read32/write32."

      - name: Putuskan spin-loop hash-probe (SPIN_BREAK)
        run: |
          set -euo pipefail
          python3 tools/patch_spin_break.py app/src/main/cpp
          grep -rq '\[SPIN_BREAK\]' app/src/main/cpp/gen/
          echo "OK: spin-loop 0x817b0cd4 diputus via sentinel slot kosong."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK (manual)
        run: |
          set -euo pipefail
          # android-actions/setup-android@v3 gagal di image runner baru
          # ("Wrong version in preinstalled sdkmanager"), jadi kita pasang sendiri.
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            unzip -q -o /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"
          echo "SDK OK: $ANDROID_SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Reconstruct debug keystore (debug signing only)
        working-directory: app
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: "Build APK (dari source_code.zip)"
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted_Port-debug
          path: app/build/outputs/apk/debug/UnchartedPort-*.apk
          if-no-files-found: error
          retention-days: 14
